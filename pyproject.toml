[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="jane-verify"
version="1.0.0"
description="Jane Verify: software validation, testing, inspection and documentation built on JaneOS."
readme="README.md"
requires-python=">=3.10"
authors=[{name="Simona Diana Thrussell"}]
license={text="Proprietary"}
dependencies=["janeos>=0.7.0"]

[project.optional-dependencies]
api=["fastapi>=0.115","uvicorn>=0.30"]
dev=["pytest>=8"]

[project.scripts]
jane-verify="jane_verify.cli:main"
jane-verify-api="jane_verify.api:main"

[tool.setuptools.packages.find]
include=["jane_verify*"]

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
